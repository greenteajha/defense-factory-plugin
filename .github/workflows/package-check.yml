name: Package check

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/check-package.py
      - run: python3 -m unittest discover -s tests -v
      - name: Build and verify release packages
        run: python3 scripts/package-release.py --out-dir "$RUNNER_TEMP/packages"
